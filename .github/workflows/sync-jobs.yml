name: 🔄 Auto Sync Jobs & Cache

on:
  schedule:
    # Run every 30 minutes (24/7 in cloud)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual run with 1-click anytime from GitHub Actions UI

concurrency:
  group: sync-jobs
  cancel-in-progress: true

jobs:
  sync:
    name: Sync Jobs Data to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline || npm install

      - name: 🏠 Warm Homepage Cache
        run: node scripts/warm-home.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: 📑 Warm Inner Pages Cache
        run: node scripts/warm-cache.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
